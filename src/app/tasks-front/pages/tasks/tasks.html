<button
  class="rounded-lg bg-indigo-700 px-4 py-2 font-medium text-white transition duration-300 hover:bg-indigo-400 mb-2"
>
  + Task
</button>

<table class="w-full whitespace-nowrap">
  <thead>
    <tr class="bg-black/60">
      <th class="text-left py-3 px-2">Title</th>
      <th class="text-left py-3 px-2">Description</th>
      <th class="text-left py-3 px-2">Assigned To</th>
      <th class="text-left py-3 px-2">Completed</th>
    </tr>
  </thead>

  <tbody>
    @for (task of taskResource.value(); track task.id) {
      <tr class="border-b border-gray-700">
        <td class="py-3 px-2 font-bold">
          <a [routerLink]="['/tasks', task.id]">
            {{ task.title }}
          </a>
        </td>

        <td class="py-3 px-2">
          <a [routerLink]="['/tasks', task.id]">
            {{ task.description }}
          </a>
        </td>

        <td class="py-3 px-2">
          <a [routerLink]="['/tasks', task.id]">
            {{ getAssignedTo(task) | titlecase }}
          </a>
        </td>
        <td class="py-3 px-2">
          <a [routerLink]="['/tasks', task.id]">
            @if (task.completed) {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="1em"
                height="1em"
                viewBox="0 0 24 24"
                class="w-6 h-6 text-indigo-400"
              >
                <path d="M0 0h24v24H0z" fill="none" />
                <path
                  fill="currentColor"
                  d="m9 20.42l-6.21-6.21l2.83-2.83L9 14.77l9.88-9.89l2.83 2.83z"
                />
              </svg>
            }
          </a>
        </td>
      </tr>
    }
  </tbody>
</table>
