<div class="mb-6 rounded-lg bg-white p-6">
  <div class="flex items-center justify-between">
    <div class="flex items-center">
      <img
        class="mr-2 h-10 w-10 rounded-full object-cover"
        src="https://images.unsplash.com/photo-1633332755192-727a05c4013d?q=80&w=2080&auto=format&fit=crop&ixlib=rb-4.0.3&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D"
        alt="profile"
      />
      <div>
        <h3 class="text-base font-semibold text-gray-900">
          {{ task()?.title }}
        </h3>
        <span class="block text-xs font-normal text-gray-500">{{
          task()?.createdAt | date
        }}</span>
      </div>
    </div>
  </div>
  <p class="my-6 text-sm font-normal text-gray-500">
    {{ task()?.description }}
  </p>
  <div
    class="mt-6 flex items-center justify-between text-sm font-semibold text-gray-900"
  >
    <div class="flex">
      @for (user of task()?.assignedTo; track user.id) {
        <span class="mr-1">{{ user.name }}</span>
      }
    </div>
    <div class="flex items-center">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        class="mr-1 h-5 w-6 text-yellow-500"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"
        />
      </svg>
      4,7 (750 Reviews)
    </div>
  </div>
</div>
